@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102a;--card:#1c1940;--ink:#efecff;--mute:#a29dc7;--pri:#9480ff;--pri2:#6c4cf0;--acc:#2fd0b0;--line:#2e2a5c;--soft:#27235a}}
:root[data-theme="dark"]{--bg:#12102a;--card:#1c1940;--ink:#efecff;--mute:#a29dc7;--pri:#9480ff;--pri2:#6c4cf0;--acc:#2fd0b0;--line:#2e2a5c;--soft:#27235a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .mid{text-align:center}.top b{font-size:17px;display:block}.top small{color:var(--mute);font-size:12px}
.ic{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;font-size:18px;background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.ic.p{background:var(--pri);color:#fff}
.banner{height:150px;border-radius:20px;background:linear-gradient(135deg,var(--pri),var(--pri2) 60%,#4b8bf5);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.banner b{font-size:20px;font-weight:800}.banner span{font-size:13px;opacity:.9}
.banner i{position:absolute;left:14px;top:8px;font-size:64px;font-style:normal;opacity:.9}
.h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.h b{font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.course{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 12px;text-align:center;font:inherit;color:inherit;cursor:pointer}
.badge{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 10px;font-size:22px}
.course b{display:block;color:var(--pri);font-size:17px}.course span{font-size:12.5px;color:var(--mute)}
.go{margin:10px auto 0;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--pri);color:var(--pri);display:grid;place-items:center}
.four{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sh{font-weight:700;color:var(--pri);margin:16px 0 8px}
.add textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;width:100%;resize:vertical}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font:inherit;color:inherit;cursor:pointer;font-size:12px;font-weight:700;line-height:1.35}
.sec i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;font-style:normal;font-size:16px;background:var(--soft)}
.sec.off{opacity:.6}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}

nav button{border:0;background:none;color:var(--mute);font:inherit;font-size:11.5px;display:grid;gap:2px;justify-items:center;cursor:pointer;min-width:56px}
nav button span{font-size:20px}

.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.row,.file{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;text-align:right;font:inherit;color:inherit}
.row{cursor:pointer}.row b,.file b{font-size:15.5px}.row small{color:var(--mute);display:block}
.star{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}.star.on{color:#f5a623}

.empty{border:1px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;color:var(--mute);line-height:1.8}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;margin-bottom:12px}

.add{display:grid;gap:8px;background:var(--card);border:1px dashed var(--pri);border-radius:14px;padding:12px;margin:12px 0}
.add input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;width:100%}

.note{font-size:12.5px;color:var(--mute);text-align:center;margin:28px 0 8px;line-height:1.9}.note a{color:var(--pri)}

 const g=id=>parseFloat((document.getElementById(id)||{}).value),c=S.cc||"dil";let t="";

 else if(c==="mol"){const x={mw:g("mw"),m:g("m"),v:g("v"),w:g("w")},e=empty(x);

  const rows=SCHED.filter(r=>r.year==S.y&&r.kind===S.sk),gs=[...new Set(rows.map(r=>r.grp))].sort(),g=gs.includes(S.sg)?S.sg:gs[0],list=rows.filter(r=>r.grp===g).sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||SLOTS.indexOf(a.time)-SLOTS.indexOf(b.time));
  app.innerHTML=bar("جداول "+yr().name,"home")+`<div class="tabs">${[["theory","النظري"],["practical","العملي"]].map(([k,n])=>`<button class="tab" aria-selected="${S.sk===k}" data-sk="${k}">${n}</button>`).join("")}</div>`+(gs.length?`<div class="chips" style="margin-bottom:12px">${gs.map(x=>`<button class="chip" aria-pressed="${x===g}" data-sg="${esc(x)}">كروب ${esc(x)}</button>`).join("")}</div><div style="overflow-x:auto"><table class="tb"><tr><th>اليوم</th><th>الوقت</th><th>المادة</th><th>المكان</th>${admin?"<th></th>":""}</tr>${list.map((r,i)=>`<tr>${i&&list[i-1].day===r.day?"":`<td rowspan="${list.filter(x=>x.day===r.day).length}" style="font-weight:700;background:var(--soft)">${esc(r.day)}</td>`}<td>${esc(r.time)}</td><td>${esc(r.subj)}${r.lect?`<small style="display:block;color:var(--mute)">${esc(r.lect)}</small>`:""}</td><td>${esc(r.place||"")}</td>${admin?`<td>${r.id?`<button class="star" data-act="delrow" data-id="${r.id}" aria-label="حذف">🗑</button>`:""}</td>`:""}</tr>`).join("")}</table></div>`:`<div class="empty">لم يُضف جدول ${S.sk==="theory"?"النظري":"العملي"} بعد.</div>`)+schForm();
 }
 else if(S.v==="klist"){
  const t={exam:"الاختبارات السابقة",sum:"الملخصات"}[S.kd],y=yr(),g=Object.values(y.courses).flat().map(m=>({m,l:(FILES[m]||{})[S.kd]||[]})).filter(x=>x.l.length);
  app.innerHTML=bar(t+" · "+y.name,"home")+(g.length?g.map(x=>`<div class="sh" dir="auto">${esc(x.m)}</div><div class="list">${x.l.map(i=>`<div class="file"><b>${esc(i.t)}</b>${fb(i)}</div>`).join("")}</div>`).join(""):`<div class="empty">لا توجد ملفات هنا بعد.<br>ستُضاف قريبًا.</div>`);mark();
 }
 else if(S.v==="q"){
  app.innerHTML=bar("استفسارات الطلبة","home")+(sb?`<div class="add"><input id="qn" placeholder="اسمك (اختياري)"><textarea id="qb" rows="3" placeholder="اكتب سؤالك…"></textarea><button class="dl" data-act="ask">إرسال السؤال</button></div>`+(QS.length?`<div class="list">${QS.map(q=>`<div class="file" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(q.name||"طالب")}</b><small style="color:var(--mute)">${new Date(q.created_at).toLocaleDateString("ar-IQ")}${admin?` <button class="star" style="font-size:16px" data-act="delq" data-id="${q.id}">🗑</button>`:""}</small></div><p style="margin:6px 0">${esc(q.body)}</p>${(q.replies||[]).sort((a,b)=>a.id-b.id).map(r=>`<div style="border-right:3px solid ${r.is_admin?"var(--acc)":"var(--line)"};padding:4px 10px;margin:6px 0;font-size:14px"><b>${esc(r.name||"طالب")}${r.is_admin?" ✓ المشرف":""}</b>: ${esc(r.body)}${admin?` <button class="star" style="font-size:16px" data-act="delr" data-id="${r.id}">🗑</button>`:""}</div>`).join("")}<div style="display:flex;gap:6px;margin-top:8px"><input class="search" style="margin:0" id="r${q.id}" placeholder="اكتب ردًا…"><button class="dl" data-act="reply" data-id="${q.id}">رد</button></div></div>`).join("")}</div>`:`<div class="empty">لا توجد أسئلة بعد. كن أول من يسأل!</div>`):`<div class="empty">يعمل بعد ربط الموقع بقاعدة البيانات.</div>`);
 }
 else if(S.v==="ai"){
  app.innerHTML=bar("المساعد الذكي","home")+`<div class="empty" style="padding:12px;margin-bottom:12px;font-size:13px">مساعد للدراسة وقد يخطئ. راجع محاضراتك ولا تعتمد عليه بقرارات طبية، ولا تكتب فيه معلومات شخصية.</div>`+(sb?`<div class="list">${CH.map(m=>`<div class="file" style="display:block;${m.role==="user"?"background:var(--soft)":""}"><b>${m.role==="user"?"أنت":"المساعد"}</b><p dir="auto" style="margin:6px 0;white-space:pre-wrap">${esc(m.text)}</p></div>`).join("")}${busy?`<div class="empty">يفكر…</div>`:""}</div><div class="add"><textarea id="aq" rows="2" placeholder="اسأل عن أي موضوع بالمختبرات الطبية…"></textarea><button class="dl" data-act="askai">إرسال</button></div>`:`<div class="empty">يعمل بعد ربط الموقع بقاعدة البيانات.</div>`);
 }
 else if(S.v==="ref"){
  const k=S.q.toLowerCase(),f=REF.filter(r=>!k||r.t.toLowerCase().includes(k)||r.g.toLowerCase().includes(k)),gs=[...new Set(f.map(r=>r.g))];
  app.innerHTML=bar("القيم الطبيعية","home")+`<div class="empty" style="padding:12px;margin-bottom:12px;font-size:13px">قيم تقريبية للبالغين لأغراض الدراسة. تختلف حسب الجهاز والمختبر والعمر والجنس، فاعتمد مرجع مختبرك ومحاضراتك.</div><input class="search" id="rq" dir="ltr" placeholder="Search… (e.g. Hb)" value="${esc(S.q)}">`+(gs.length?gs.map(g=>`<div class="sh" dir="ltr">${esc(g)}</div><div style="overflow-x:auto"><table class="tb" dir="ltr"><tr><th>Test</th><th>Normal range</th><th>Unit</th></tr>${f.filter(r=>r.g===g).map(r=>`<tr><td style="text-align:left;font-weight:700">${esc(r.t)}</td><td>${esc(r.v)}</td><td>${esc(r.u)}</td></tr>`).join("")}</table></div>`).join(""):`<div class="empty">ما لقينا فحص بهذا الاسم.</div>`);
  const rq=document.getElementById("rq");rq.oninput=()=>{S.q=rq.value;render();const n=document.getElementById("rq");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
 }
 else if(S.v==="calc"){
  const c=S.cc||"dil";
  app.innerHTML=bar("حاسبة المختبر","home")+`<div class="chips" style="margin-bottom:12px">${Object.keys(CALCN).map(k=>`<button class="chip" aria-pressed="${k===c}" data-cc="${k}">${CALCN[k]}</button>`).join("")}</div><div class="add"><small style="color:var(--mute);line-height:1.7">${CALCH[c]}</small>`+(c==="conv"?`<select id="cs">${CONV.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join("")}</select><select id="cd"><option value="0">من الوحدة التقليدية إلى SI</option><option value="1">من SI إلى التقليدية</option></select>`:"")+CALCF[c].map(([id,l])=>`<label dir="auto" style="display:grid;gap:4px;font-size:13px">${l}<input id="${id}" type="number" inputmode="decimal" step="any" dir="ltr"></label>`).join("")+`</div><div class="empty" id="cr" dir="auto" style="line-height:2;font-size:17px;color:var(--ink)"></div>`;
  calc();
 }
 else if(S.v==="more"){app.innerHTML=bar("المزيد","home")+`${adminBox()}${credit()}`}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.nav){go({v:d.nav,q:""});if(d.nav==="q")loadQ()}
 else if(d.year)go({y:d.year});
 else if(d.course)go({v:"course",c:d.course});
 else if(d.sub){const[y,c,m]=d.sub.split("|");go({v:"sub",y,c,s:m,tab:"lec",from:S.v==="course"?"course":S.v})}
 else if(d.fav){fav=fav.includes(d.fav)?fav.filter(x=>x!==d.fav):[...fav,d.fav];saveFav();render()}
 else if(d.tab){S.tab=d.tab;render()}
 else if(d.go)go({v:d.go});
 else if(d.act)act(d.act,d);
 else if(d.sk){S.sk=d.sk;S.sg="";render()}
 else if(d.sg){S.sg=d.sg;render()}
 else if(d.kd)go({v:"klist",kd:d.kd});
 else if(d.cc){S.cc=d.cc;render()}
});
render();init();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
